name: Unit Tests

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    types: [synchronize, opened, reopened]

permissions: {}

jobs:
  phpunit:
    name: PHP + WP Unit ${{ matrix.php-version }} / Ramsey ${{ matrix.ramsey-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ 8.1, 8.2, 8.3, 8.4 ]
        ramsey-version: [ "^1", "^2" ]

    steps:
      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Build CI image
        run: |
          docker build \
            --build-arg PHP_VERSION=${{ matrix.php-version }} \
            -t wpconnections-ci:${{ matrix.php-version }} \
            -f Dockerfile.phpunit .

      - name: Run PHP and WordPress unit tests
        run: |
          docker run --rm -v "$PWD:/srv/web" \
            -e RAMSEY_VERSION='${{ matrix.ramsey-version }}' \
            wpconnections-ci:${{ matrix.php-version }} \
            test:all
