name: Unit Tests

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    types: [synchronize, opened, reopened]

permissions: {}

env:
  WP_VERSION: "6.7.7"

jobs:
  phpunit:
    name: Unit Tests PHP ${{ matrix.php-version }} / Ramsey ${{ matrix.ramsey-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.1.34", "8.2.33", "8.3.33", "8.4.25", "8.5.10" ]
        ramsey-version: [ "1.3.0", "2.1.1" ]

    steps:
      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Build CI image
        run: |
          docker build \
            --build-arg PHP_VERSION=${{ matrix.php-version }} \
            --build-arg WP_VERSION=${{ env.WP_VERSION }} \
            -t wpconnections-ci:unit-php-${{ matrix.php-version }}-ramsey-${{ matrix.ramsey-version }} \
            -f Dockerfile.phpunit .

      - name: Run unit tests
        run: |
          docker run --rm -v "$PWD:/srv/web" \
            -e RAMSEY_VERSION='${{ matrix.ramsey-version }}' \
            wpconnections-ci:unit-php-${{ matrix.php-version }}-ramsey-${{ matrix.ramsey-version }} \
            test:phpunit
