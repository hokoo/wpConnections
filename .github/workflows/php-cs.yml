name: PHP Code Styles

env:
  PHP_VERSION: "8.1.34"
  WP_VERSION: "6.7.7"
  CI_IMAGE: wpconnections-ci:phpcs

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    types: [synchronize, opened, reopened]

permissions: {}

jobs:
  php-cs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CI image
        run: |
          docker build \
            --build-arg PHP_VERSION=${{ env.PHP_VERSION }} \
            --build-arg WP_VERSION=${{ env.WP_VERSION }} \
            -t ${{ env.CI_IMAGE }} \
            -f Dockerfile.phpunit .

      - name: Run PHPCS
        run: |
          docker run --rm -v "$PWD:/srv/web" \
            ${{ env.CI_IMAGE }} \
            cs:phpcs
