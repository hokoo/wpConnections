name: Coverage

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    types: [synchronize, opened, reopened]

permissions: {}

env:
  PHP_VERSION: "8.1.34"
  WP_VERSION: "6.7.7"
  COVERAGE_IMAGE: wpconnections-coverage
  ISOLATION_SEED: "20260910"

jobs:
  coverage:
    name: Coverage PHP 8.1.34 / WordPress 6.7.7
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Build coverage image
        run: |
          docker build \
            --build-arg PHP_VERSION=${{ env.PHP_VERSION }} \
            --build-arg WP_VERSION=${{ env.WP_VERSION }} \
            -t ${{ env.COVERAGE_IMAGE }} \
            -f Dockerfile.phpunit .

      - name: Run combined coverage gate
        run: |
          docker run --rm -v "$PWD:/srv/web" \
            ${{ env.COVERAGE_IMAGE }} \
            test:coverage

      - name: Verify quality policy tools
        run: |
          docker run --rm -v "$PWD:/srv/web" \
            ${{ env.COVERAGE_IMAGE }} \
            test:quality-tools

      - name: Run reverse and seeded-random isolation checks
        run: |
          docker run --rm -v "$PWD:/srv/web" \
            -e TEST_RANDOM_SEED=${{ env.ISOLATION_SEED }} \
            ${{ env.COVERAGE_IMAGE }} \
            test:isolation

      - name: Publish coverage summary
        if: ${{ always() && hashFiles('build/coverage/coverage-summary.md') != '' }}
        run: cat build/coverage/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-php-8.1.34-wp-6.7.7
          path: build/coverage/
          if-no-files-found: warn
          retention-days: 14
